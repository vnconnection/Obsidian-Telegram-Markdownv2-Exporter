name: Release

on:
  push:
    tags:
      - "0.[0-9]*.[0-9]*"
      - "[1-9][0-9]*.[0-9]*.[0-9]*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Validate bare semver tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != "tag" || ! "$GITHUB_REF_NAME" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release must run only for an exact bare X.Y.Z tag; received: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Check out tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Test release contract
        run: node --test release.test.mjs

      - name: Verify tracked bundle before build
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --error-unmatch -- main.js >/dev/null
          git diff --exit-code --no-ext-diff HEAD -- main.js
          test -s main.js

      - name: Production build
        run: npm run build

      - name: Verify tracked bundle after build
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --error-unmatch -- main.js >/dev/null
          git diff --exit-code --no-ext-diff HEAD -- main.js
          test -s main.js

      - name: Validate release assets and metadata
        run: npm run release:validate -- "$GITHUB_REF_NAME"

      - name: Package BRAT ZIP
        shell: bash
        env:
          ZIP_PATH: artifacts/telegram-markdownv2-exporter-${{ github.ref_name }}.zip
        run: |
          set -euo pipefail
          npm run release:package -- "$GITHUB_REF_NAME" "$ZIP_PATH"
          test -s "$ZIP_PATH"
          mapfile -t zip_entries < <(unzip -Z1 "$ZIP_PATH")
          expected_entries=(main.js manifest.json)
          if [[ "${#zip_entries[@]}" -ne "${#expected_entries[@]}" ]] || [[ "${zip_entries[*]}" != "${expected_entries[*]}" ]]; then
            printf 'Unexpected ZIP root layout:\n%s\n' "${zip_entries[*]}" >&2
            exit 1
          fi

      - name: Create or update GitHub Release with authored notes
        shell: bash
        env:
          ZIP_PATH: artifacts/telegram-markdownv2-exporter-${{ github.ref_name }}.zip
          RELEASE_NOTES_PATH: docs/releases/${{ github.ref_name }}.md
        run: |
          set -euo pipefail
          test -s "$RELEASE_NOTES_PATH"
          release_assets=(main.js manifest.json "$ZIP_PATH")

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${release_assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --notes-file "$RELEASE_NOTES_PATH" \
              --title "$GITHUB_REF_NAME" \
              --draft=false \
              --prerelease=false
          else
            gh release create "$GITHUB_REF_NAME" "${release_assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --notes-file "$RELEASE_NOTES_PATH" \
              --title "$GITHUB_REF_NAME" \
              --draft=false \
              --prerelease=false
          fi

      - name: Verify published tag, body, assets, and checksums
        shell: bash
        env:
          ZIP_PATH: artifacts/telegram-markdownv2-exporter-${{ github.ref_name }}.zip
          RELEASE_NOTES_PATH: docs/releases/${{ github.ref_name }}.md
        run: |
          set -euo pipefail
          expected_commit="$(git rev-parse HEAD)"
          remote_refs="$(git ls-remote origin "refs/tags/$GITHUB_REF_NAME" "refs/tags/$GITHUB_REF_NAME^{}")"
          remote_tag_target="$(awk \
            -v tag_ref="refs/tags/$GITHUB_REF_NAME" \
            -v peeled_ref="refs/tags/$GITHUB_REF_NAME^{}" '
              $2 == peeled_ref { print $1; found_peeled = 1; exit }
              $2 == tag_ref { tag_object = $1 }
              END { if (!found_peeled && tag_object != "") print tag_object }
            ' <<<"$remote_refs")"
          test -n "$remote_tag_target"
          test "$remote_tag_target" = "$expected_commit"

          release_status="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,publishedAt,tagName)"
          test "$(jq -r '.tagName' <<<"$release_status")" = "$GITHUB_REF_NAME"
          test "$(jq -r '.isDraft' <<<"$release_status")" = "false"
          test "$(jq -r '.isPrerelease' <<<"$release_status")" = "false"
          test -n "$(jq -r '.publishedAt // empty' <<<"$release_status")"

          verify_directory="$(mktemp -d)"
          trap 'rm -rf "$verify_directory"' EXIT
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --template '{{.body}}' > "$verify_directory/release-body.md"
          cmp -s "$RELEASE_NOTES_PATH" "$verify_directory/release-body.md"

          zip_name="$(basename "$ZIP_PATH")"
          expected_assets=(main.js manifest.json "$zip_name")
          mapfile -t actual_assets < <(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)
          mapfile -t sorted_expected_assets < <(printf '%s\n' "${expected_assets[@]}" | sort)
          if [[ "${actual_assets[*]}" != "${sorted_expected_assets[*]}" ]]; then
            printf 'Unexpected published assets:\n%s\n' "${actual_assets[*]}" >&2
            exit 1
          fi
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.size <= 0) | .name' | (! grep -q .)

          checksum_file="$verify_directory/release.sha256"
          for asset in main.js manifest.json "$ZIP_PATH"; do
            asset_name="$(basename "$asset")"
            asset_hash="$(sha256sum "$asset" | cut -d ' ' -f 1)"
            printf '%s  %s\n' "$asset_hash" "$asset_name" >> "$checksum_file"
          done
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$verify_directory" --clobber
          (cd "$verify_directory" && sha256sum -c "$checksum_file")
